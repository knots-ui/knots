<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Triangle</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>

  <body>
    <canvas id="canvas"></canvas>
    <script type="module">
      import { startKnots } from "./knots.js";

      startKnots({
        wasmUrl: "./app.wasm",
        canvas: "#canvas",
      }).catch((err) => {
        console.error(err);
      });
    </script>
  </body>
</html>
